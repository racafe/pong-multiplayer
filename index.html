<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PONG - Game Screen</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231a1a2e'/%3E%3Crect x='10' y='18' width='6' height='28' fill='%234ade80'/%3E%3Crect x='48' y='18' width='6' height='28' fill='%23f472b6'/%3E%3Ccircle cx='32' cy='32' r='5' fill='%23fff'/%3E%3C/svg%3E">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a0a0f;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Courier New', monospace;
      color: #fff;
    }

    /* ========================================
       CONNECTION SCREEN STYLES
       ======================================== */
    .connection-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
      padding: 40px;
    }

    .title {
      font-size: 72px;
      font-weight: bold;
      color: #fff;
      text-shadow:
        0 0 10px #fff,
        0 0 20px #fff,
        0 0 40px #0ff,
        0 0 80px #0ff,
        0 0 120px #0ff;
      letter-spacing: 20px;
      animation: neonPulse 2s ease-in-out infinite;
    }

    @keyframes neonPulse {
      0%, 100% {
        text-shadow:
          0 0 10px #fff,
          0 0 20px #fff,
          0 0 40px #0ff,
          0 0 80px #0ff,
          0 0 120px #0ff;
      }
      50% {
        text-shadow:
          0 0 5px #fff,
          0 0 10px #fff,
          0 0 20px #0ff,
          0 0 40px #0ff,
          0 0 60px #0ff;
      }
    }

    .subtitle {
      font-size: 16px;
      color: rgba(255, 255, 255, 0.6);
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    .qr-container {
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      box-shadow:
        0 0 20px rgba(0, 255, 255, 0.3),
        0 0 40px rgba(0, 255, 255, 0.1);
    }

    #qrcode {
      width: 200px;
      height: 200px;
    }

    #qrcode canvas {
      width: 100% !important;
      height: 100% !important;
    }

    .room-code-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .room-code-label {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.5);
      text-transform: uppercase;
      letter-spacing: 4px;
    }

    .room-code {
      font-size: 56px;
      font-weight: bold;
      letter-spacing: 16px;
      color: #0ff;
      text-shadow:
        0 0 10px #0ff,
        0 0 20px #0ff,
        0 0 40px #0ff;
    }

    /* Player status container */
    .players-status {
      display: flex;
      gap: 60px;
      margin-top: 10px;
    }

    .player-status {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      min-width: 150px;
    }

    .player-label {
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .player-status.player1 .player-label {
      color: #4ade80;
      text-shadow: 0 0 10px rgba(74, 222, 128, 0.5);
    }

    .player-status.player2 .player-label {
      color: #f472b6;
      text-shadow: 0 0 10px rgba(244, 114, 182, 0.5);
    }

    .player-indicator {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #555;
      animation: pulse 1.5s ease-in-out infinite;
    }

    .status-dot.waiting {
      background: #f59e0b;
    }

    .status-dot.connected {
      background: #4ade80;
      animation: none;
      box-shadow: 0 0 10px #4ade80;
    }

    .player-status.player2 .status-dot.connected {
      background: #f472b6;
      box-shadow: 0 0 10px #f472b6;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.9); }
    }

    .status-text {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.6);
    }

    .status-text.connected {
      color: #4ade80;
    }

    .player-status.player2 .status-text.connected {
      color: #f472b6;
    }

    /* Main status message */
    .main-status {
      font-size: 20px;
      color: rgba(255, 255, 255, 0.8);
      min-height: 30px;
    }

    .main-status.ready {
      color: #4ade80;
      text-shadow: 0 0 20px rgba(74, 222, 128, 0.5);
      animation: readyPulse 1s ease-in-out infinite;
    }

    @keyframes readyPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }

    .instructions {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.4);
      text-align: center;
      max-width: 400px;
      line-height: 1.6;
    }

    .controller-url {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.3);
      margin-top: 10px;
    }

    /* ========================================
       GAME AREA STYLES
       ======================================== */
    .game-area {
      display: none;
      width: 100%;
      height: 100%;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0a0a0f;
    }

    .game-area.visible {
      display: flex;
    }

    #gameCanvas {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      box-shadow:
        0 0 40px rgba(0, 255, 255, 0.2),
        0 0 80px rgba(0, 255, 255, 0.1);
    }

    /* Sound toggle button */
    .sound-toggle {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.6);
      border: 2px solid rgba(0, 255, 255, 0.3);
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      z-index: 100;
    }

    .sound-toggle.visible {
      display: flex;
    }

    .sound-toggle:hover {
      background: rgba(0, 0, 0, 0.8);
      border-color: rgba(0, 255, 255, 0.6);
    }

    .sound-toggle svg {
      width: 24px;
      height: 24px;
      fill: #0ff;
    }

    .sound-toggle.muted svg {
      fill: #ff6b6b;
    }

    /* ========================================
       PAUSE OVERLAY (for disconnect)
       ======================================== */
    .pause-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.85);
      z-index: 50;
    }

    .pause-overlay.visible {
      display: flex;
    }

    .pause-title {
      font-size: 48px;
      font-weight: bold;
      color: #f59e0b;
      text-shadow:
        0 0 20px rgba(245, 158, 11, 0.8),
        0 0 40px rgba(245, 158, 11, 0.4);
      margin-bottom: 20px;
      text-align: center;
    }

    .pause-message {
      font-size: 24px;
      color: rgba(255, 255, 255, 0.8);
      margin-bottom: 30px;
      text-align: center;
    }

    .pause-timer {
      font-size: 36px;
      font-weight: bold;
      color: #0ff;
      text-shadow: 0 0 15px rgba(0, 255, 255, 0.6);
      margin-bottom: 30px;
    }

    .pause-end-button {
      display: none;
      background: linear-gradient(145deg, #ef4444, #dc2626);
      color: #fff;
      border: none;
      padding: 16px 40px;
      font-size: 20px;
      font-weight: bold;
      font-family: 'Courier New', monospace;
      border-radius: 10px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 2px;
      transition: transform 0.1s, box-shadow 0.1s;
      box-shadow: 0 0 20px rgba(239, 68, 68, 0.4);
    }

    .pause-end-button.visible {
      display: block;
    }

    .pause-end-button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 30px rgba(239, 68, 68, 0.6);
    }

    .pause-end-button:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>
  <!-- Connection Screen -->
  <div class="connection-screen" id="connectionScreen">
    <h1 class="title">PONG</h1>
    <p class="subtitle">Scan to join the game</p>

    <div class="qr-container">
      <div id="qrcode"></div>
    </div>

    <div class="room-code-container">
      <span class="room-code-label">Room Code</span>
      <span class="room-code" id="roomCode">----</span>
    </div>

    <div class="players-status">
      <div class="player-status player1">
        <span class="player-label">Player 1</span>
        <div class="player-indicator">
          <div class="status-dot waiting" id="player1Dot"></div>
          <span class="status-text" id="player1Status">Waiting...</span>
        </div>
      </div>
      <div class="player-status player2">
        <span class="player-label">Player 2</span>
        <div class="player-indicator">
          <div class="status-dot" id="player2Dot"></div>
          <span class="status-text" id="player2Status">Waiting...</span>
        </div>
      </div>
    </div>

    <p class="main-status" id="mainStatus">Connecting to server...</p>

    <p class="instructions">
      Open the camera app on your phone and scan the QR code,
      or visit the URL below and enter the room code manually.
    </p>

    <span class="controller-url" id="controllerUrl"></span>
  </div>

  <!-- Game Area (hidden until both players connect) -->
  <div class="game-area" id="gameArea">
    <canvas id="gameCanvas"></canvas>

    <!-- Pause Overlay (for disconnect) -->
    <div class="pause-overlay" id="pauseOverlay">
      <div class="pause-title" id="pauseTitle">PAUSED</div>
      <div class="pause-message" id="pauseMessage">Player 1 Disconnected</div>
      <div class="pause-timer" id="pauseTimer">Waiting for reconnect... 30</div>
      <button class="pause-end-button" id="pauseEndButton">End Game</button>
    </div>
  </div>

  <!-- Sound Toggle Button -->
  <button class="sound-toggle" id="soundToggle" title="Toggle Sound">
    <svg id="soundOnIcon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
    </svg>
    <svg id="soundOffIcon" style="display: none;" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
    </svg>
  </button>

  <!-- QR Code library from CDN -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.2.2/build/qrcode.min.js"></script>

  <script type="module">
    // ========================================
    // CONFIGURATION
    // ========================================
    const GAME_HOSTNAME = window.location.hostname;
    const IS_SSL = window.location.protocol === 'https:';

    // Detect if we're on localhost or a raw IP address
    const IS_IP_HOST = /^[0-9.]+$/.test(GAME_HOSTNAME);
    const IS_DEV_HOST = GAME_HOSTNAME === 'localhost' || IS_IP_HOST;

    // WebSocket URL: use same-origin reverse proxy at /ws
    const WS_URL = `${IS_SSL ? 'wss' : 'ws'}://${window.location.host}/ws`;

    // Controller URL: same host but different page
    const CONTROLLER_BASE_URL = IS_SSL
      ? `https://${GAME_HOSTNAME}`
      : `http://${GAME_HOSTNAME}${IS_DEV_HOST ? ':' + window.location.port : ''}`;

    // ========================================
    // DOM ELEMENTS
    // ========================================
    const connectionScreen = document.getElementById('connectionScreen');
    const gameArea = document.getElementById('gameArea');
    const qrcodeElement = document.getElementById('qrcode');
    const roomCodeElement = document.getElementById('roomCode');
    const controllerUrlElement = document.getElementById('controllerUrl');
    const mainStatus = document.getElementById('mainStatus');
    const player1Dot = document.getElementById('player1Dot');
    const player1Status = document.getElementById('player1Status');
    const player2Dot = document.getElementById('player2Dot');
    const player2Status = document.getElementById('player2Status');
    const soundToggle = document.getElementById('soundToggle');

    // Pause overlay elements
    const pauseOverlay = document.getElementById('pauseOverlay');
    const pauseTitle = document.getElementById('pauseTitle');
    const pauseMessage = document.getElementById('pauseMessage');
    const pauseTimer = document.getElementById('pauseTimer');
    const pauseEndButton = document.getElementById('pauseEndButton');

    // ========================================
    // STATE
    // ========================================
    let ws = null;
    let roomCode = null;
    let isConnected = false;
    let player1Connected = false;
    let player2Connected = false;

    // Disconnect/pause state
    let isGameInProgress = false;      // True once game starts (both players connected)
    let disconnectedPlayer = null;      // 'player1' or 'player2' if someone disconnected
    let disconnectTimerId = null;       // Timer for 30-second countdown
    let disconnectSecondsRemaining = 0; // Countdown seconds

    // ========================================
    // STATUS DISPLAY FUNCTIONS
    // ========================================

    function setMainStatus(text, isReady = false) {
      mainStatus.textContent = text;
      if (isReady) {
        mainStatus.classList.add('ready');
      } else {
        mainStatus.classList.remove('ready');
      }
    }

    function updatePlayerStatus(player, connected) {
      if (player === 'player1') {
        player1Connected = connected;
        if (connected) {
          player1Dot.classList.remove('waiting');
          player1Dot.classList.add('connected');
          player1Status.textContent = 'Connected!';
          player1Status.classList.add('connected');
        } else {
          player1Dot.classList.add('waiting');
          player1Dot.classList.remove('connected');
          player1Status.textContent = 'Waiting...';
          player1Status.classList.remove('connected');
        }
      } else if (player === 'player2') {
        player2Connected = connected;
        if (connected) {
          player2Dot.classList.add('connected');
          player2Status.textContent = 'Connected!';
          player2Status.classList.add('connected');
        } else {
          player2Dot.classList.remove('connected');
          player2Status.textContent = 'Waiting...';
          player2Status.classList.remove('connected');
        }
      }

      // Update main status based on player states
      updateMainStatusFromPlayers();
    }

    function updateMainStatusFromPlayers() {
      if (player1Connected && player2Connected) {
        setMainStatus('Both players connected - Starting game!', true);
        // Transition to game after a brief delay
        setTimeout(() => {
          showGameArea();
        }, 1500);
      } else if (player1Connected) {
        setMainStatus('Waiting for Player 2...');
        // Make player 2 dot pulse
        player2Dot.classList.add('waiting');
      } else {
        setMainStatus('Waiting for Player 1...');
      }
    }

    // ========================================
    // QR CODE GENERATION
    // ========================================

    function generateQRCode(code) {
      const controllerUrl = `${CONTROLLER_BASE_URL}/controller.html?room=${code}`;

      // Clear any existing QR code
      qrcodeElement.innerHTML = '';

      const qr = globalThis.QRCode;
      if (!qr || typeof qr.toCanvas !== 'function') {
        console.error('QR library not loaded (QRCode.toCanvas missing).');
        controllerUrlElement.textContent = controllerUrl;
        return;
      }

      // Generate new QR code
      qr.toCanvas(controllerUrl, {
        width: 200,
        margin: 0,
        color: {
          dark: '#0a0a0f',
          light: '#ffffff'
        }
      }, (error, canvas) => {
        if (error) {
          console.error('QR Code generation error:', error);
          return;
        }
        qrcodeElement.appendChild(canvas);
      });

      // Update display URL
      controllerUrlElement.textContent = controllerUrl;
    }

    function updateRoomCode(code) {
      roomCode = code;
      roomCodeElement.textContent = code;
      generateQRCode(code);
    }

    // ========================================
    // WEBSOCKET CONNECTION
    // ========================================

    function connect() {
      setMainStatus('Connecting to server...');

      ws = new WebSocket(WS_URL);

      ws.onopen = () => {
        isConnected = true;
        setMainStatus('Creating room...');

        // Request a new room
        ws.send(JSON.stringify({ type: 'create_room' }));
      };

      ws.onmessage = (event) => {
        const message = JSON.parse(event.data);
        handleMessage(message);
      };

      ws.onerror = (error) => {
        console.error('WebSocket error:', error);
        setMainStatus('Connection error - retrying...');
        isConnected = false;

        // Retry connection after a delay
        setTimeout(connect, 3000);
      };

      ws.onclose = () => {
        if (isConnected) {
          isConnected = false;
          setMainStatus('Disconnected - reconnecting...');
          setTimeout(connect, 2000);
        }
      };
    }

    // ========================================
    // MESSAGE HANDLING
    // ========================================

    function handleMessage(message) {
      switch (message.type) {
        case 'room_created':
          updateRoomCode(message.data.roomCode);
          setMainStatus('Waiting for Player 1...');
          break;

        case 'player1_joined':
          updatePlayerStatus('player1', true);
          break;

        case 'player2_joined':
          updatePlayerStatus('player2', true);
          break;

        case 'player1_disconnected':
          updatePlayerStatus('player1', false);
          // Handle disconnect during gameplay
          if (isGameInProgress) {
            handlePlayerDisconnectDuringGame('player1');
          }
          break;

        case 'player2_disconnected':
          updatePlayerStatus('player2', false);
          // Handle disconnect during gameplay
          if (isGameInProgress) {
            handlePlayerDisconnectDuringGame('player2');
          }
          break;

        case 'player1_reconnected':
          updatePlayerStatus('player1', true);
          // Handle reconnect during gameplay
          if (isGameInProgress) {
            handlePlayerReconnectDuringGame('player1');
          }
          break;

        case 'player2_reconnected':
          updatePlayerStatus('player2', true);
          // Handle reconnect during gameplay
          if (isGameInProgress) {
            handlePlayerReconnectDuringGame('player2');
          }
          break;

        case 'error':
          console.error('Server error:', message.data?.message);
          setMainStatus(`Error: ${message.data?.message || 'Unknown error'}`);
          break;

        case 'reconnected':
          // Host reconnected - restore status
          setMainStatus(player1Connected && player2Connected
            ? 'Both players connected!'
            : player1Connected
              ? 'Waiting for Player 2...'
              : 'Waiting for Player 1...');
          break;

        case 'paddle_move':
          // Handle paddle position update from controller
          // Message includes player identifier and position (0-100)
          if (message.player && typeof message.data?.position === 'number') {
            const position = Math.max(0, Math.min(100, message.data.position));
            setPaddleTargetPosition(message.player, position);
          }
          break;

        default:
          // Forward other messages to game logic (future stories)
          console.log('Game message:', message);
          break;
      }
    }

    // ========================================
    // PAUSE OVERLAY FUNCTIONS
    // ========================================

    const DISCONNECT_TIMEOUT_SECONDS = 30;

    function showPauseOverlay(playerName) {
      disconnectedPlayer = playerName;
      disconnectSecondsRemaining = DISCONNECT_TIMEOUT_SECONDS;

      // Update overlay content
      pauseTitle.textContent = 'PAUSED';
      pauseMessage.textContent = `${playerName === 'player1' ? 'Player 1' : 'Player 2'} Disconnected`;
      updatePauseTimerDisplay();
      pauseEndButton.classList.remove('visible');

      // Show overlay and pause game
      pauseOverlay.classList.add('visible');
      pauseGame();

      // Start countdown timer
      startDisconnectTimer();
    }

    function hidePauseOverlay() {
      pauseOverlay.classList.remove('visible');
      pauseEndButton.classList.remove('visible');
      stopDisconnectTimer();
      disconnectedPlayer = null;
    }

    function updatePauseTimerDisplay() {
      pauseTimer.textContent = `Waiting for reconnect... ${disconnectSecondsRemaining}`;
    }

    function startDisconnectTimer() {
      stopDisconnectTimer(); // Clear any existing timer

      disconnectTimerId = setInterval(() => {
        disconnectSecondsRemaining--;
        updatePauseTimerDisplay();

        if (disconnectSecondsRemaining <= 0) {
          // Show end game button after timeout
          pauseTimer.textContent = 'Reconnect timed out';
          pauseEndButton.classList.add('visible');
          stopDisconnectTimer();
        }
      }, 1000);
    }

    function stopDisconnectTimer() {
      if (disconnectTimerId) {
        clearInterval(disconnectTimerId);
        disconnectTimerId = null;
      }
    }

    function handleEndGameClick() {
      // End the game and return to connection screen
      hidePauseOverlay();
      stopGameLoop();
      isGameInProgress = false;
      player1Connected = false;
      player2Connected = false;

      // Reset game state
      gameState.gameOver = true;
      gameState.winner = null;

      // Show connection screen
      gameArea.classList.remove('visible');
      soundToggle.classList.remove('visible');
      connectionScreen.style.display = 'flex';

      // Reset player statuses
      updatePlayerStatus('player1', false);
      updatePlayerStatus('player2', false);
      setMainStatus('Game ended. Waiting for players...');
    }

    function handlePlayerDisconnectDuringGame(player) {
      if (!isGameInProgress || gameState.gameOver) return;

      // Show pause overlay
      showPauseOverlay(player);
    }

    function handlePlayerReconnectDuringGame(player) {
      // Only resume if this was the disconnected player
      if (disconnectedPlayer === player) {
        hidePauseOverlay();
        resumeGame();
      }
    }

    // ========================================
    // GAME AREA TRANSITION
    // ========================================

    function showGameArea() {
      connectionScreen.style.display = 'none';
      gameArea.classList.add('visible');
      soundToggle.classList.add('visible');

      // Mark game as in progress
      isGameInProgress = true;

      // Initialize audio context (for sound effects)
      initAudioContext();

      // Initialize game canvas (placeholder for US-003)
      initGameCanvas();
    }

    // ========================================
    // GAME CANVAS & RENDERING
    // ========================================

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Canvas dimensions
    const CANVAS_WIDTH = 800;
    const CANVAS_HEIGHT = 600;

    canvas.width = CANVAS_WIDTH;
    canvas.height = CANVAS_HEIGHT;

    // ========================================
    // GAME CONSTANTS
    // ========================================
    const PADDLE_WIDTH = 15;
    const PADDLE_HEIGHT = 100;
    const PADDLE_OFFSET = 30;  // Distance from edge
    const BALL_RADIUS = 10;
    const CENTER_LINE_DASH = [20, 15];
    const CENTER_LINE_WIDTH = 4;

    // Ball physics constants
    const BALL_INITIAL_SPEED = 5;       // Initial ball speed (pixels per frame)
    const BALL_MAX_SPEED = 12;          // Maximum ball speed
    const BALL_SPEED_INCREMENT = 0.3;   // Speed increase per paddle hit
    const MAX_BOUNCE_ANGLE = Math.PI / 4; // 45 degrees max bounce angle

    // Game settings
    const WINNING_SCORE = 5;
    const SCORE_RESET_DELAY = 1000;     // 1 second pause after scoring

    // Neon colors
    const COLORS = {
      background: '#0a0a0f',
      player1: '#4ade80',      // Neon green
      player2: '#f472b6',      // Neon pink/magenta
      ball: '#ffffff',
      centerLine: '#0ff',      // Cyan
      score: '#ffffff'
    };

    // ========================================
    // GAME STATE
    // ========================================
    const gameState = {
      // Paddle positions (y-coordinate of center, 0-100 normalized)
      paddle1Y: 50,  // Player 1 (left)
      paddle2Y: 50,  // Player 2 (right)

      // Ball position (center of canvas initially)
      ballX: CANVAS_WIDTH / 2,
      ballY: CANVAS_HEIGHT / 2,

      // Ball velocity
      ballVX: 0,     // Horizontal velocity
      ballVY: 0,     // Vertical velocity
      ballSpeed: BALL_INITIAL_SPEED,  // Current ball speed

      // Scores
      score1: 0,
      score2: 0,

      // Game running state
      isRunning: false,
      isPaused: false,
      isWaitingForReset: false,  // True during score reset delay
      gameOver: false,
      winner: null,              // 'player1' or 'player2' when game ends
      lastScorer: null           // Who scored last (ball served toward them)
    };

    // Animation frame ID for cleanup
    let animationFrameId = null;

    // ========================================
    // SOUND SYSTEM (Web Audio API)
    // ========================================
    let audioContext = null;
    let soundEnabled = true;  // Sounds on by default

    // Initialize audio context (must be called after user interaction)
    function initAudioContext() {
      if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
      }
      // Resume if suspended (browser autoplay policy)
      if (audioContext.state === 'suspended') {
        audioContext.resume();
      }
    }

    // Play a tone with given frequency, duration, and optional type
    function playTone(frequency, duration, type = 'square', volume = 0.3) {
      if (!soundEnabled || !audioContext) return;

      const oscillator = audioContext.createOscillator();
      const gainNode = audioContext.createGain();

      oscillator.type = type;
      oscillator.frequency.setValueAtTime(frequency, audioContext.currentTime);

      // Quick attack, sustain, then fade out
      gainNode.gain.setValueAtTime(0, audioContext.currentTime);
      gainNode.gain.linearRampToValueAtTime(volume, audioContext.currentTime + 0.01);
      gainNode.gain.linearRampToValueAtTime(volume, audioContext.currentTime + duration - 0.05);
      gainNode.gain.linearRampToValueAtTime(0, audioContext.currentTime + duration);

      oscillator.connect(gainNode);
      gainNode.connect(audioContext.destination);

      oscillator.start(audioContext.currentTime);
      oscillator.stop(audioContext.currentTime + duration);
    }

    // Sound effect: Ball hits paddle (high beep)
    function playPaddleHitSound() {
      playTone(440, 0.1, 'square', 0.25);  // A4 note, short beep
    }

    // Sound effect: Ball hits wall (lower beep)
    function playWallHitSound() {
      playTone(220, 0.08, 'square', 0.2);  // A3 note, shorter lower beep
    }

    // Sound effect: Point scored (longer descending tone)
    function playScoreSound() {
      if (!soundEnabled || !audioContext) return;

      const oscillator = audioContext.createOscillator();
      const gainNode = audioContext.createGain();

      oscillator.type = 'square';
      // Descending pitch from C5 to C4
      oscillator.frequency.setValueAtTime(523, audioContext.currentTime);
      oscillator.frequency.linearRampToValueAtTime(262, audioContext.currentTime + 0.3);

      gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
      gainNode.gain.linearRampToValueAtTime(0, audioContext.currentTime + 0.4);

      oscillator.connect(gainNode);
      gainNode.connect(audioContext.destination);

      oscillator.start(audioContext.currentTime);
      oscillator.stop(audioContext.currentTime + 0.4);
    }

    // Sound effect: Victory jingle (ascending arpeggio)
    function playVictorySound() {
      if (!soundEnabled || !audioContext) return;

      // Play ascending notes: C5 -> E5 -> G5 -> C6
      const notes = [523, 659, 784, 1047];  // C5, E5, G5, C6
      const noteDuration = 0.15;
      const gap = 0.12;

      notes.forEach((freq, index) => {
        const startTime = audioContext.currentTime + index * gap;

        const oscillator = audioContext.createOscillator();
        const gainNode = audioContext.createGain();

        oscillator.type = 'square';
        oscillator.frequency.setValueAtTime(freq, startTime);

        gainNode.gain.setValueAtTime(0, startTime);
        gainNode.gain.linearRampToValueAtTime(0.3, startTime + 0.02);
        gainNode.gain.linearRampToValueAtTime(0.3, startTime + noteDuration - 0.03);
        gainNode.gain.linearRampToValueAtTime(0, startTime + noteDuration);

        oscillator.connect(gainNode);
        gainNode.connect(audioContext.destination);

        oscillator.start(startTime);
        oscillator.stop(startTime + noteDuration);
      });

      // Final sustained chord
      const chordTime = audioContext.currentTime + notes.length * gap;
      [523, 659, 784, 1047].forEach((freq) => {
        const oscillator = audioContext.createOscillator();
        const gainNode = audioContext.createGain();

        oscillator.type = 'triangle';  // Softer sound for chord
        oscillator.frequency.setValueAtTime(freq, chordTime);

        gainNode.gain.setValueAtTime(0, chordTime);
        gainNode.gain.linearRampToValueAtTime(0.15, chordTime + 0.05);
        gainNode.gain.linearRampToValueAtTime(0.15, chordTime + 0.4);
        gainNode.gain.linearRampToValueAtTime(0, chordTime + 0.7);

        oscillator.connect(gainNode);
        gainNode.connect(audioContext.destination);

        oscillator.start(chordTime);
        oscillator.stop(chordTime + 0.7);
      });
    }

    // Toggle sound on/off
    function toggleSound() {
      soundEnabled = !soundEnabled;
      updateSoundToggleUI();

      // Play a confirmation beep when enabling sound
      if (soundEnabled) {
        initAudioContext();
        playTone(880, 0.1, 'sine', 0.2);  // High A, soft sine wave
      }
    }

    // Update sound toggle button appearance
    function updateSoundToggleUI() {
      const soundOnIcon = document.getElementById('soundOnIcon');
      const soundOffIcon = document.getElementById('soundOffIcon');

      if (soundEnabled) {
        soundToggle.classList.remove('muted');
        soundOnIcon.style.display = 'block';
        soundOffIcon.style.display = 'none';
      } else {
        soundToggle.classList.add('muted');
        soundOnIcon.style.display = 'none';
        soundOffIcon.style.display = 'block';
      }
    }

    // ========================================
    // PADDLE INTERPOLATION
    // ========================================
    // Target positions for smooth interpolation
    let paddle1TargetY = 50;
    let paddle2TargetY = 50;

    // Interpolation speed (0-1, higher = faster/snappier)
    const PADDLE_INTERPOLATION_SPEED = 0.25;

    // Set target position for a paddle (called when receiving paddle_move)
    function setPaddleTargetPosition(player, position) {
      if (player === 'player1') {
        paddle1TargetY = position;
      } else if (player === 'player2') {
        paddle2TargetY = position;
      }
    }

    // Interpolate paddle positions toward their targets (called each frame)
    function updatePaddles() {
      // Linear interpolation for smooth movement
      const diff1 = paddle1TargetY - gameState.paddle1Y;
      const diff2 = paddle2TargetY - gameState.paddle2Y;

      // Only update if difference is significant
      if (Math.abs(diff1) > 0.01) {
        gameState.paddle1Y += diff1 * PADDLE_INTERPOLATION_SPEED;
      } else {
        gameState.paddle1Y = paddle1TargetY;
      }

      if (Math.abs(diff2) > 0.01) {
        gameState.paddle2Y += diff2 * PADDLE_INTERPOLATION_SPEED;
      } else {
        gameState.paddle2Y = paddle2TargetY;
      }

      // Clamp to valid range (0-100)
      gameState.paddle1Y = Math.max(0, Math.min(100, gameState.paddle1Y));
      gameState.paddle2Y = Math.max(0, Math.min(100, gameState.paddle2Y));
    }

    // ========================================
    // HELPER FUNCTIONS
    // ========================================

    // Convert normalized paddle position (0-100) to canvas Y coordinate
    function paddleYToCanvas(normalizedY) {
      // 0 = bottom, 100 = top (inverted for canvas)
      const playableHeight = CANVAS_HEIGHT - PADDLE_HEIGHT;
      return playableHeight - (normalizedY / 100) * playableHeight;
    }

    // ========================================
    // BALL PHYSICS
    // ========================================

    // Serve the ball toward a direction (1 = right toward player2, -1 = left toward player1)
    function serveBall(direction) {
      gameState.ballX = CANVAS_WIDTH / 2;
      gameState.ballY = CANVAS_HEIGHT / 2;
      gameState.ballSpeed = BALL_INITIAL_SPEED;

      // Random angle between -30 and 30 degrees
      const angle = (Math.random() - 0.5) * Math.PI / 3;
      gameState.ballVX = direction * gameState.ballSpeed * Math.cos(angle);
      gameState.ballVY = gameState.ballSpeed * Math.sin(angle);
    }

    // Check and handle collision with top/bottom walls
    function handleWallCollision() {
      // Top wall
      if (gameState.ballY - BALL_RADIUS <= 0) {
        gameState.ballY = BALL_RADIUS;
        gameState.ballVY = -gameState.ballVY;
        playWallHitSound();
        return true;
      }
      // Bottom wall
      if (gameState.ballY + BALL_RADIUS >= CANVAS_HEIGHT) {
        gameState.ballY = CANVAS_HEIGHT - BALL_RADIUS;
        gameState.ballVY = -gameState.ballVY;
        playWallHitSound();
        return true;
      }
      return false;
    }

    // Check collision with a paddle and return hit position (-1 to 1) or null if no hit
    function checkPaddleCollision(paddleX, paddleY) {
      const paddleTop = paddleY;
      const paddleBottom = paddleY + PADDLE_HEIGHT;
      const paddleLeft = paddleX;
      const paddleRight = paddleX + PADDLE_WIDTH;

      // Check if ball intersects paddle
      if (gameState.ballX + BALL_RADIUS >= paddleLeft &&
          gameState.ballX - BALL_RADIUS <= paddleRight &&
          gameState.ballY + BALL_RADIUS >= paddleTop &&
          gameState.ballY - BALL_RADIUS <= paddleBottom) {

        // Calculate hit position (-1 = top, 0 = center, 1 = bottom)
        const paddleCenter = paddleY + PADDLE_HEIGHT / 2;
        const hitPosition = (gameState.ballY - paddleCenter) / (PADDLE_HEIGHT / 2);
        return Math.max(-1, Math.min(1, hitPosition));
      }
      return null;
    }

    // Handle paddle collision and update ball velocity
    function handlePaddleCollision() {
      // Player 1 paddle (left)
      const paddle1X = PADDLE_OFFSET;
      const paddle1Y = paddleYToCanvas(gameState.paddle1Y);

      if (gameState.ballVX < 0) {  // Ball moving left
        const hitPos = checkPaddleCollision(paddle1X, paddle1Y);
        if (hitPos !== null) {
          // Bounce off paddle with angle based on hit position
          const bounceAngle = hitPos * MAX_BOUNCE_ANGLE;
          gameState.ballSpeed = Math.min(gameState.ballSpeed + BALL_SPEED_INCREMENT, BALL_MAX_SPEED);
          gameState.ballVX = gameState.ballSpeed * Math.cos(bounceAngle);
          gameState.ballVY = gameState.ballSpeed * Math.sin(bounceAngle);

          // Ensure ball is outside paddle
          gameState.ballX = paddle1X + PADDLE_WIDTH + BALL_RADIUS;
          playPaddleHitSound();
          return true;
        }
      }

      // Player 2 paddle (right)
      const paddle2X = CANVAS_WIDTH - PADDLE_OFFSET - PADDLE_WIDTH;
      const paddle2Y = paddleYToCanvas(gameState.paddle2Y);

      if (gameState.ballVX > 0) {  // Ball moving right
        const hitPos = checkPaddleCollision(paddle2X, paddle2Y);
        if (hitPos !== null) {
          // Bounce off paddle with angle based on hit position
          const bounceAngle = hitPos * MAX_BOUNCE_ANGLE;
          gameState.ballSpeed = Math.min(gameState.ballSpeed + BALL_SPEED_INCREMENT, BALL_MAX_SPEED);
          gameState.ballVX = -gameState.ballSpeed * Math.cos(bounceAngle);
          gameState.ballVY = gameState.ballSpeed * Math.sin(bounceAngle);

          // Ensure ball is outside paddle
          gameState.ballX = paddle2X - BALL_RADIUS;
          playPaddleHitSound();
          return true;
        }
      }

      return false;
    }

    // Check if a point was scored
    function checkScoring() {
      // Ball passed left side - Player 2 scores
      if (gameState.ballX + BALL_RADIUS < 0) {
        gameState.score2++;
        gameState.lastScorer = 'player2';
        return 'player2';
      }

      // Ball passed right side - Player 1 scores
      if (gameState.ballX - BALL_RADIUS > CANVAS_WIDTH) {
        gameState.score1++;
        gameState.lastScorer = 'player1';
        return 'player1';
      }

      return null;
    }

    // Check if game is over
    function checkGameOver() {
      if (gameState.score1 >= WINNING_SCORE) {
        gameState.gameOver = true;
        gameState.winner = 'player1';
        return true;
      }
      if (gameState.score2 >= WINNING_SCORE) {
        gameState.gameOver = true;
        gameState.winner = 'player2';
        return true;
      }
      return false;
    }

    // Reset ball after scoring (with delay)
    function resetBallAfterScore(scorer) {
      gameState.isWaitingForReset = true;
      gameState.ballVX = 0;
      gameState.ballVY = 0;
      gameState.ballX = CANVAS_WIDTH / 2;
      gameState.ballY = CANVAS_HEIGHT / 2;

      setTimeout(() => {
        if (!gameState.gameOver) {
          gameState.isWaitingForReset = false;
          // Serve toward the player who scored
          const direction = scorer === 'player1' ? 1 : -1;
          serveBall(direction);
        }
      }, SCORE_RESET_DELAY);
    }

    // Update ball position and handle physics
    function updateBall() {
      if (gameState.isPaused || gameState.isWaitingForReset || gameState.gameOver) {
        return;
      }

      // Move ball
      gameState.ballX += gameState.ballVX;
      gameState.ballY += gameState.ballVY;

      // Handle wall collisions
      handleWallCollision();

      // Handle paddle collisions
      handlePaddleCollision();

      // Check for scoring
      const scorer = checkScoring();
      if (scorer) {
        if (checkGameOver()) {
          // Game over - stop ball and play victory sound
          gameState.ballVX = 0;
          gameState.ballVY = 0;
          playVictorySound();
        } else {
          // Play score sound and reset ball after delay
          playScoreSound();
          resetBallAfterScore(scorer);
        }
      }
    }

    // ========================================
    // RENDERING FUNCTIONS
    // ========================================

    function clearCanvas() {
      ctx.fillStyle = COLORS.background;
      ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
    }

    function drawCenterLine() {
      ctx.save();
      ctx.strokeStyle = COLORS.centerLine;
      ctx.lineWidth = CENTER_LINE_WIDTH;
      ctx.setLineDash(CENTER_LINE_DASH);

      // Add subtle glow effect
      ctx.shadowBlur = 10;
      ctx.shadowColor = COLORS.centerLine;

      ctx.beginPath();
      ctx.moveTo(CANVAS_WIDTH / 2, 0);
      ctx.lineTo(CANVAS_WIDTH / 2, CANVAS_HEIGHT);
      ctx.stroke();

      ctx.restore();
    }

    function drawPaddle(x, y, color) {
      ctx.save();

      // Multi-layer glow for neon effect
      ctx.shadowBlur = 25;
      ctx.shadowColor = color;
      ctx.fillStyle = color;

      // Draw paddle
      ctx.fillRect(x, y, PADDLE_WIDTH, PADDLE_HEIGHT);

      // Add brighter inner glow by drawing again with less blur
      ctx.shadowBlur = 10;
      ctx.fillRect(x, y, PADDLE_WIDTH, PADDLE_HEIGHT);

      // Draw bright core
      ctx.shadowBlur = 0;
      ctx.globalAlpha = 0.3;
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(x + 3, y + 3, PADDLE_WIDTH - 6, PADDLE_HEIGHT - 6);

      ctx.restore();
    }

    function drawPlayer1Paddle() {
      const x = PADDLE_OFFSET;
      const y = paddleYToCanvas(gameState.paddle1Y);
      drawPaddle(x, y, COLORS.player1);
    }

    function drawPlayer2Paddle() {
      const x = CANVAS_WIDTH - PADDLE_OFFSET - PADDLE_WIDTH;
      const y = paddleYToCanvas(gameState.paddle2Y);
      drawPaddle(x, y, COLORS.player2);
    }

    function drawBall() {
      ctx.save();

      // Outer glow
      ctx.shadowBlur = 30;
      ctx.shadowColor = COLORS.ball;
      ctx.fillStyle = COLORS.ball;

      ctx.beginPath();
      ctx.arc(gameState.ballX, gameState.ballY, BALL_RADIUS, 0, Math.PI * 2);
      ctx.fill();

      // Inner bright glow
      ctx.shadowBlur = 15;
      ctx.beginPath();
      ctx.arc(gameState.ballX, gameState.ballY, BALL_RADIUS, 0, Math.PI * 2);
      ctx.fill();

      // Bright core
      ctx.shadowBlur = 0;
      ctx.globalAlpha = 0.5;
      ctx.beginPath();
      ctx.arc(gameState.ballX, gameState.ballY, BALL_RADIUS * 0.5, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function drawScores() {
      ctx.save();

      const scoreY = 70;
      const scoreSize = 64;

      ctx.font = `bold ${scoreSize}px "Courier New", monospace`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      // Player 1 score (left side, green tint)
      ctx.shadowBlur = 20;
      ctx.shadowColor = COLORS.player1;
      ctx.fillStyle = COLORS.score;
      ctx.fillText(gameState.score1.toString(), CANVAS_WIDTH / 4, scoreY);

      // Player 2 score (right side, pink tint)
      ctx.shadowColor = COLORS.player2;
      ctx.fillText(gameState.score2.toString(), (CANVAS_WIDTH / 4) * 3, scoreY);

      ctx.restore();
    }

    function drawWinnerAnnouncement() {
      if (!gameState.gameOver || !gameState.winner) return;

      ctx.save();

      // Semi-transparent overlay
      ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
      ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

      // Winner text
      const winnerColor = gameState.winner === 'player1' ? COLORS.player1 : COLORS.player2;
      const playerNum = gameState.winner === 'player1' ? '1' : '2';

      ctx.font = 'bold 72px "Courier New", monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      // Neon glow effect for winner text
      ctx.shadowBlur = 30;
      ctx.shadowColor = winnerColor;
      ctx.fillStyle = winnerColor;
      ctx.fillText(`PLAYER ${playerNum}`, CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2 - 50);

      ctx.font = 'bold 48px "Courier New", monospace';
      ctx.shadowBlur = 20;
      ctx.fillStyle = '#ffffff';
      ctx.shadowColor = '#ffffff';
      ctx.fillText('WINS!', CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2 + 30);

      // Press to play again hint (for future US-010)
      ctx.font = '20px "Courier New", monospace';
      ctx.shadowBlur = 10;
      ctx.shadowColor = '#0ff';
      ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
      ctx.fillText('Game Over', CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2 + 100);

      ctx.restore();
    }

    function render() {
      // Clear and redraw everything
      clearCanvas();
      drawCenterLine();
      drawScores();
      drawPlayer1Paddle();
      drawPlayer2Paddle();
      drawBall();

      // Draw winner announcement if game is over
      if (gameState.gameOver) {
        drawWinnerAnnouncement();
      }
    }

    function gameLoop() {
      // Update paddle positions (interpolate toward targets)
      updatePaddles();

      // Update ball physics
      updateBall();

      // Render the frame
      render();

      // Continue loop if game is running
      if (gameState.isRunning) {
        animationFrameId = requestAnimationFrame(gameLoop);
      }
    }

    function startGameLoop() {
      if (!gameState.isRunning) {
        gameState.isRunning = true;
        gameLoop();
      }
    }

    function stopGameLoop() {
      gameState.isRunning = false;
      if (animationFrameId) {
        cancelAnimationFrame(animationFrameId);
        animationFrameId = null;
      }
    }

    // ========================================
    // GAME INITIALIZATION
    // ========================================

    function initGameCanvas() {
      // Reset game state
      gameState.paddle1Y = 50;
      gameState.paddle2Y = 50;
      gameState.ballX = CANVAS_WIDTH / 2;
      gameState.ballY = CANVAS_HEIGHT / 2;
      gameState.ballVX = 0;
      gameState.ballVY = 0;
      gameState.ballSpeed = BALL_INITIAL_SPEED;
      gameState.score1 = 0;
      gameState.score2 = 0;
      gameState.isPaused = false;
      gameState.isWaitingForReset = false;
      gameState.gameOver = false;
      gameState.winner = null;
      gameState.lastScorer = null;

      // Initial render
      render();

      // Start the game loop
      startGameLoop();

      // Serve the ball (random direction for first serve)
      const initialDirection = Math.random() < 0.5 ? 1 : -1;
      serveBall(initialDirection);
    }

    // ========================================
    // EXTERNAL API (for other stories)
    // ========================================

    // Update paddle position from controller input (0-100)
    function updatePaddlePosition(player, position) {
      if (player === 'player1') {
        gameState.paddle1Y = Math.max(0, Math.min(100, position));
      } else if (player === 'player2') {
        gameState.paddle2Y = Math.max(0, Math.min(100, position));
      }
    }

    // Update ball position (for physics/game logic in US-004)
    function updateBallPosition(x, y) {
      gameState.ballX = x;
      gameState.ballY = y;
    }

    // Update scores (for game logic in US-004)
    function updateScores(score1, score2) {
      gameState.score1 = score1;
      gameState.score2 = score2;
    }

    // Get current game state (for external access)
    function getGameState() {
      return { ...gameState };
    }

    // Pause the game (for US-008 disconnect handling)
    function pauseGame() {
      gameState.isPaused = true;
    }

    // Resume the game (for US-008 reconnection)
    function resumeGame() {
      gameState.isPaused = false;
    }

    // Reset game for a new match (for US-010)
    function resetGame() {
      // Reset all state except paddles (keep player positions)
      gameState.ballX = CANVAS_WIDTH / 2;
      gameState.ballY = CANVAS_HEIGHT / 2;
      gameState.ballVX = 0;
      gameState.ballVY = 0;
      gameState.ballSpeed = BALL_INITIAL_SPEED;
      gameState.score1 = 0;
      gameState.score2 = 0;
      gameState.isPaused = false;
      gameState.isWaitingForReset = false;
      gameState.gameOver = false;
      gameState.winner = null;

      // Serve toward the player who lost
      const serveDirection = gameState.lastScorer === 'player1' ? -1 : 1;
      gameState.lastScorer = null;
      serveBall(serveDirection);
    }

    // Check if game is over
    function isGameOver() {
      return gameState.gameOver;
    }

    // Get winner (returns 'player1', 'player2', or null)
    function getWinner() {
      return gameState.winner;
    }

    // ========================================
    // EVENT LISTENERS
    // ========================================

    // End Game button click handler
    pauseEndButton.addEventListener('click', handleEndGameClick);

    // Sound toggle button click handler
    soundToggle.addEventListener('click', () => {
      initAudioContext();  // Ensure audio context is ready
      toggleSound();
    });

    // ========================================
    // INITIALIZE
    // ========================================

    connect();

    // Export functions for external use / debugging
    window.showGameArea = showGameArea;
    window.updatePlayerStatus = updatePlayerStatus;

    // Export game rendering API (for US-004, US-005, etc.)
    window.pongGame = {
      updatePaddlePosition,
      updateBallPosition,
      updateScores,
      getGameState,
      startGameLoop,
      stopGameLoop,
      render,
      pauseGame,
      resumeGame,
      resetGame,
      isGameOver,
      getWinner,
      // Constants exposed for external use
      CANVAS_WIDTH,
      CANVAS_HEIGHT,
      PADDLE_WIDTH,
      PADDLE_HEIGHT,
      PADDLE_OFFSET,
      BALL_RADIUS,
      WINNING_SCORE
    };

    // Debug: Allow transitioning to game from console
    window.debugStartGame = function() {
      player1Connected = true;
      player2Connected = true;
      showGameArea();
    };
