<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frogger - Game Screen</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231a1a2e'/%3E%3Cpath d='M18 36c0 8 6 14 14 14s14-6 14-14V22c0-4-3-7-7-7H25c-4 0-7 3-7 7v14z' fill='%234ade80'/%3E%3Ccircle cx='26' cy='26' r='3' fill='%230b1220'/%3E%3Ccircle cx='38' cy='26' r='3' fill='%230b1220'/%3E%3Cpath d='M25 36c2 3 5 5 7 5s5-2 7-5' stroke='%230b1220' stroke-width='4' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #fff;
    }

    .connection-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
      padding: 40px;
    }

    .title {
      font-size: 48px;
      font-weight: bold;
      color: #4ade80;
      text-shadow: 0 0 20px rgba(74, 222, 128, 0.5);
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 18px;
      color: rgba(255, 255, 255, 0.7);
      margin-bottom: 20px;
    }

    .qr-container {
      background: #fff;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }

    #qrcode {
      width: 200px;
      height: 200px;
    }

    #qrcode canvas {
      width: 100% !important;
      height: 100% !important;
    }

    .room-code-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .room-code-label {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.6);
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .room-code {
      font-size: 48px;
      font-weight: bold;
      letter-spacing: 12px;
      color: #4ade80;
      font-family: 'Courier New', monospace;
      text-shadow: 0 0 10px rgba(74, 222, 128, 0.5);
    }

    .status-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #f59e0b;
      animation: pulse 1.5s ease-in-out infinite;
    }

    .status-dot.connected {
      background: #4ade80;
      animation: none;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.9); }
    }

    .status-text {
      font-size: 20px;
      color: rgba(255, 255, 255, 0.8);
    }

    .status-text.connected {
      color: #4ade80;
    }

    .instructions {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.5);
      text-align: center;
      max-width: 400px;
      line-height: 1.6;
    }

    .controller-url {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.4);
      margin-top: 20px;
      font-family: 'Courier New', monospace;
    }

    /* Hidden game area - will be shown once connected */
    .game-area {
      display: none;
      width: 100%;
      height: 100%;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    .game-area.visible {
      display: flex;
    }

    #gameCanvas {
      /* Pixel-perfect rendering - no anti-aliasing */
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      border: 4px solid #333;
      box-shadow: 0 0 40px rgba(74, 222, 128, 0.3);
    }

    /* Sound toggle button */
    .sound-toggle {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.6);
      border: 2px solid rgba(255, 255, 255, 0.3);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      z-index: 100;
    }

    .sound-toggle:hover {
      background: rgba(0, 0, 0, 0.8);
      border-color: rgba(74, 222, 128, 0.6);
    }

    .sound-toggle svg {
      width: 24px;
      height: 24px;
      fill: #4ade80;
    }

    .sound-toggle.muted svg {
      fill: #ff6b6b;
    }
  </style>
</head>
<body>
  <div class="connection-screen" id="connectionScreen">
    <h1 class="title">FROGGER</h1>
    <p class="subtitle">Scan to connect your phone as a controller</p>

    <div class="qr-container">
      <div id="qrcode"></div>
    </div>

    <div class="room-code-container">
      <span class="room-code-label">Room Code</span>
      <span class="room-code" id="roomCode">----</span>
    </div>

    <div class="status-container">
      <div class="status-indicator">
        <div class="status-dot" id="statusDot"></div>
        <span class="status-text" id="statusText">Connecting to server...</span>
      </div>
    </div>

    <p class="instructions">
      Open the camera app on your phone and scan the QR code,
      or visit the URL below and enter the room code manually.
    </p>

    <span class="controller-url" id="controllerUrl"></span>
  </div>

  <div class="game-area" id="gameArea">
    <canvas id="gameCanvas"></canvas>
    <button class="sound-toggle" id="soundToggle" title="Toggle Sound">
      <svg id="soundOnIcon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
      </svg>
      <svg id="soundOffIcon" style="display: none;" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
      </svg>
    </button>
  </div>

  <!-- qrcode browser bundle from CDN (exposes global `QRCode`) -->
  <!-- Note: newer qrcode versions removed `build/` bundles; pin to one that includes them. -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.2.2/build/qrcode.min.js"></script>

  <script type="module">
    // Configuration
    const GAME_HOSTNAME = window.location.hostname;
    const IS_SSL = window.location.protocol === 'https:';

    // Detect if we're on localhost or a raw IP address
    const IS_IP_HOST = /^[0-9.]+$/.test(GAME_HOSTNAME);
    const IS_DEV_HOST = GAME_HOSTNAME === 'localhost' || IS_IP_HOST;

    // WebSocket URL: use same-origin reverse proxy at /ws so we don't need a
    // dedicated external port (important for PaaS like Coolify).
    const WS_URL = `${IS_SSL ? 'wss' : 'ws'}://${window.location.host}/ws`;

    // Controller URL: same host but different page
    const CONTROLLER_BASE_URL = IS_SSL
      ? `https://${GAME_HOSTNAME}`
      : `http://${GAME_HOSTNAME}${IS_DEV_HOST ? ':' + window.location.port : ''}`;

    // DOM elements
    const connectionScreen = document.getElementById('connectionScreen');
    const gameArea = document.getElementById('gameArea');
    const qrcodeElement = document.getElementById('qrcode');
    const roomCodeElement = document.getElementById('roomCode');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const controllerUrlElement = document.getElementById('controllerUrl');

    // State
    let ws = null;
    let roomCode = null;
    let isConnected = false;
    let playerConnected = false;

    // Update status display
    function setStatus(text, isPlayerConnected = false) {
      statusText.textContent = text;

      if (isPlayerConnected) {
        statusDot.classList.add('connected');
        statusText.classList.add('connected');
      } else {
        statusDot.classList.remove('connected');
        statusText.classList.remove('connected');
      }
    }

    // Generate QR code for controller URL
    function generateQRCode(code) {
      const controllerUrl = `${CONTROLLER_BASE_URL}/controller.html?room=${code}`;

      // Clear any existing QR code
      qrcodeElement.innerHTML = '';

      const qr = globalThis.QRCode;
      if (!qr || typeof qr.toCanvas !== 'function') {
        console.error('QR library not loaded (QRCode.toCanvas missing).');
        controllerUrlElement.textContent = controllerUrl;
        return;
      }

      // Generate new QR code
      qr.toCanvas(controllerUrl, {
        width: 200,
        margin: 0,
        color: {
          dark: '#1a1a2e',
          light: '#ffffff'
        }
      }, (error, canvas) => {
        if (error) {
          console.error('QR Code generation error:', error);
          return;
        }
        qrcodeElement.appendChild(canvas);
      });

      // Update display URL
      controllerUrlElement.textContent = controllerUrl;
    }

    // Update room code display
    function updateRoomCode(code) {
      roomCode = code;
      roomCodeElement.textContent = code;
      generateQRCode(code);
    }

    // Connect to WebSocket server
    function connect() {
      setStatus('Connecting to server...');

      ws = new WebSocket(WS_URL);

      ws.onopen = () => {
        isConnected = true;
        setStatus('Creating room...');

        // Request a new room
        ws.send(JSON.stringify({ type: 'create_room' }));
      };

      ws.onmessage = (event) => {
        const message = JSON.parse(event.data);
        handleMessage(message);
      };

      ws.onerror = (error) => {
        console.error('WebSocket error:', error);
        setStatus('Connection error - retrying...');
        isConnected = false;

        // Retry connection after a delay
        setTimeout(connect, 3000);
      };

      ws.onclose = () => {
        if (isConnected) {
          isConnected = false;
          setStatus('Disconnected - reconnecting...');
          setTimeout(connect, 2000);
        }
      };
    }

    // Handle incoming WebSocket messages
    function handleMessage(message) {
      switch (message.type) {
        case 'room_created':
          updateRoomCode(message.data.roomCode);
          setStatus('Waiting for controller...');
          break;

        case 'player_joined':
          playerConnected = true;
          setStatus('Controller connected!', true);
          break;

        case 'player_disconnected':
          playerConnected = false;
          setStatus('Controller disconnected - waiting...', false);
          break;

        case 'error':
          console.error('Server error:', message.data?.message);
          setStatus(`Error: ${message.data?.message || 'Unknown error'}`);
          break;

        case 'reconnected':
          setStatus(playerConnected ? 'Controller connected!' : 'Waiting for controller...', playerConnected);
          break;

        default:
          // Forward other messages to game logic (future stories)
          console.log('Game message:', message);
          break;
      }
    }

    // Initialize
    connect();

    // ========================================
    // GAME CANVAS & SPRITE RENDERING SYSTEM
    // ========================================

    // Classic Frogger arcade proportions (224x256 original, scaled up)
    const SCALE = 3; // Scale factor for modern displays
    const CANVAS_WIDTH = 224 * SCALE;  // 672px
    const CANVAS_HEIGHT = 256 * SCALE; // 768px
    const TILE_SIZE = 16 * SCALE;      // 48px (each lane/tile is 16px in original)

    // Lane configuration (14 lanes from bottom to top + header)
    const LANES = {
      HEADER: 0,           // Score/lives display area
      HOME_ROW: 1,         // Goal lilypads (5 homes)
      RIVER_START: 2,      // River lanes (5 lanes)
      RIVER_END: 6,
      MEDIAN: 7,           // Safe median zone
      ROAD_START: 8,       // Road lanes (5 lanes)
      ROAD_END: 12,
      START_ZONE: 13,      // Frog start position (safe)
      FOOTER: 14           // Bottom border
    };

    // Authentic Frogger Color Palette (based on arcade original)
    const COLORS = {
      // Background colors
      BLACK: '#000000',
      DARK_BLUE: '#000050',
      WATER_BLUE: '#0000a8',
      ROAD_GRAY: '#404040',
      ROAD_DARK: '#282828',
      GRASS_GREEN: '#00a800',
      GRASS_DARK: '#006800',
      MEDIAN_PURPLE: '#800080',

      // Sprite colors
      FROG_GREEN: '#00ff00',
      FROG_LIGHT: '#80ff80',
      FROG_DARK: '#008800',
      FROG_EYE: '#ffffff',
      FROG_PUPIL: '#000000',

      // Car colors (multiple types)
      CAR_RED: '#ff0000',
      CAR_YELLOW: '#ffff00',
      CAR_PINK: '#ff80ff',
      CAR_WHITE: '#ffffff',
      CAR_BLUE: '#0080ff',
      CAR_ORANGE: '#ff8000',

      // Truck colors
      TRUCK_BODY: '#ff00ff',
      TRUCK_CABIN: '#ff80ff',
      TRUCK_DETAIL: '#800080',

      // Log colors
      LOG_BROWN: '#804000',
      LOG_LIGHT: '#a06020',
      LOG_DARK: '#603000',
      LOG_BARK: '#402000',

      // Turtle colors
      TURTLE_GREEN: '#00a800',
      TURTLE_SHELL: '#008000',
      TURTLE_HEAD: '#80ff80',
      TURTLE_LIGHT: '#00ff00',

      // UI colors
      UI_WHITE: '#ffffff',
      UI_YELLOW: '#ffff00',
      LILYPAD_GREEN: '#00a800',
      LILYPAD_DARK: '#006800'
    };

    // Canvas setup
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    canvas.width = CANVAS_WIDTH;
    canvas.height = CANVAS_HEIGHT;

    // Disable image smoothing for pixel-perfect rendering
    ctx.imageSmoothingEnabled = false;
    ctx.mozImageSmoothingEnabled = false;
    ctx.webkitImageSmoothingEnabled = false;
    ctx.msImageSmoothingEnabled = false;

    // ========================================
    // SPRITE RENDERING UTILITIES
    // ========================================

    // Draw a single pixel (scaled)
    function drawPixel(x, y, color) {
      ctx.fillStyle = color;
      ctx.fillRect(x * SCALE, y * SCALE, SCALE, SCALE);
    }

    // Draw a pixel array sprite at position
    function drawSprite(sprite, x, y, flipX = false) {
      const height = sprite.length;
      const width = sprite[0].length;

      for (let row = 0; row < height; row++) {
        for (let col = 0; col < width; col++) {
          const color = sprite[row][flipX ? (width - 1 - col) : col];
          if (color !== null && color !== 'transparent') {
            const px = x + col;
            const py = y + row;
            drawPixel(px, py, color);
          }
        }
      }
    }

    // ========================================
    // SPRITE DEFINITIONS (16x16 pixel art)
    // ========================================

    // Shorthand color aliases for sprite definitions
    const _ = null; // Transparent
    const FG = COLORS.FROG_GREEN;
    const FL = COLORS.FROG_LIGHT;
    const FD = COLORS.FROG_DARK;
    const FE = COLORS.FROG_EYE;
    const FP = COLORS.FROG_PUPIL;
    const CR = COLORS.CAR_RED;
    const CY = COLORS.CAR_YELLOW;
    const CP = COLORS.CAR_PINK;
    const CW = COLORS.CAR_WHITE;
    const CB = COLORS.CAR_BLUE;
    const CO = COLORS.CAR_ORANGE;
    const BK = COLORS.BLACK;
    const TB = COLORS.TRUCK_BODY;
    const TC = COLORS.TRUCK_CABIN;
    const TD = COLORS.TRUCK_DETAIL;
    const LB = COLORS.LOG_BROWN;
    const LL = COLORS.LOG_LIGHT;
    const LD = COLORS.LOG_DARK;
    const LK = COLORS.LOG_BARK;
    const TG = COLORS.TURTLE_GREEN;
    const TS = COLORS.TURTLE_SHELL;
    const TH = COLORS.TURTLE_HEAD;
    const TL = COLORS.TURTLE_LIGHT;

    // FROG SPRITES
    const FROG_IDLE = [
      [_, _, _, _, _, FG, FG, _, _, FG, FG, _, _, _, _, _],
      [_, _, _, _, FG, FE, FE, FG, FG, FE, FE, FG, _, _, _, _],
      [_, _, _, _, FG, FP, FE, FG, FG, FE, FP, FG, _, _, _, _],
      [_, _, _, _, _, FG, FG, FG, FG, FG, FG, _, _, _, _, _],
      [_, _, FG, _, _, FG, FG, FG, FG, FG, FG, _, _, FG, _, _],
      [_, FG, FG, FG, FG, FL, FG, FG, FG, FG, FL, FG, FG, FG, FG, _],
      [_, FG, _, FG, FG, FG, FG, FG, FG, FG, FG, FG, FG, _, FG, _],
      [_, _, _, _, FG, FG, FG, FG, FG, FG, FG, FG, _, _, _, _],
      [_, _, _, FG, FG, FG, FD, FD, FD, FD, FG, FG, FG, _, _, _],
      [_, _, FG, FG, _, FG, FG, FG, FG, FG, FG, _, FG, FG, _, _],
      [_, FG, FG, _, _, FG, FG, FG, FG, FG, FG, _, _, FG, FG, _],
      [_, FG, _, _, _, FD, FG, FG, FG, FG, FD, _, _, _, FG, _],
      [FG, FG, _, _, _, _, FG, FG, FG, FG, _, _, _, _, FG, FG],
      [FG, _, _, _, _, _, FG, _, _, FG, _, _, _, _, _, FG],
      [_, _, _, _, _, _, _, _, _, _, _, _, _, _, _, _],
      [_, _, _, _, _, _, _, _, _, _, _, _, _, _, _, _]
    ];

    const FROG_HOP_1 = [
      [_, _, _, _, _, FG, FG, _, _, FG, FG, _, _, _, _, _],
      [_, _, _, _, FG, FE, FE, FG, FG, FE, FE, FG, _, _, _, _],
      [_, _, _, _, FG, FP, FE, FG, FG, FE, FP, FG, _, _, _, _],
      [_, _, _, _, _, FG, FG, FG, FG, FG, FG, _, _, _, _, _],
      [_, FG, FG, _, _, FG, FG, FG, FG, FG, FG, _, _, FG, FG, _],
      [FG, FG, FG, FG, FG, FL, FG, FG, FG, FG, FL, FG, FG, FG, FG, FG],
      [FG, _, _, FG, FG, FG, FG, FG, FG, FG, FG, FG, FG, _, _, FG],
      [_, _, _, _, FG, FG, FG, FG, FG, FG, FG, FG, _, _, _, _],
      [_, _, _, _, FG, FG, FD, FD, FD, FD, FG, FG, _, _, _, _],
      [_, _, _, _, _, FG, FG, FG, FG, FG, FG, _, _, _, _, _],
      [_, _, _, _, _, FG, FG, FG, FG, FG, FG, _, _, _, _, _],
      [_, _, _, _, FD, FG, FG, FG, FG, FG, FG, FD, _, _, _, _],
      [_, _, _, FG, FG, _, FG, FG, FG, FG, _, FG, FG, _, _, _],
      [_, _, FG, FG, _, _, FG, _, _, FG, _, _, FG, FG, _, _],
      [_, FG, FG, _, _, _, _, _, _, _, _, _, _, FG, FG, _],
      [_, _, _, _, _, _, _, _, _, _, _, _, _, _, _, _]
    ];

    const FROG_HOP_2 = [
      [_, _, _, _, _, FG, FG, _, _, FG, FG, _, _, _, _, _],
      [_, _, _, _, FG, FE, FE, FG, FG, FE, FE, FG, _, _, _, _],
      [_, _, _, _, FG, FP, FE, FG, FG, FE, FP, FG, _, _, _, _],
      [_, _, FG, _, _, FG, FG, FG, FG, FG, FG, _, _, FG, _, _],
      [_, FG, FG, _, _, FG, FG, FG, FG, FG, FG, _, _, FG, FG, _],
      [FG, FG, _, FG, FG, FL, FG, FG, FG, FG, FL, FG, FG, _, FG, FG],
      [FG, _, _, FG, FG, FG, FG, FG, FG, FG, FG, FG, FG, _, _, FG],
      [_, _, _, FG, FG, FG, FG, FG, FG, FG, FG, FG, FG, _, _, _],
      [_, _, _, _, FG, FG, FD, FD, FD, FD, FG, FG, _, _, _, _],
      [_, _, _, _, _, FG, FG, FG, FG, FG, FG, _, _, _, _, _],
      [_, _, _, _, _, FD, FG, FG, FG, FG, FD, _, _, _, _, _],
      [_, _, _, _, FG, FG, FG, _, _, FG, FG, FG, _, _, _, _],
      [_, _, _, FG, FG, _, _, _, _, _, _, FG, FG, _, _, _],
      [_, _, FG, FG, _, _, _, _, _, _, _, _, FG, FG, _, _],
      [_, _, _, _, _, _, _, _, _, _, _, _, _, _, _, _],
      [_, _, _, _, _, _, _, _, _, _, _, _, _, _, _, _]
    ];

    // CAR SPRITES (different colors/types)
    function createCarSprite(bodyColor, highlightColor) {
      return [
        [_, _, _, _, _, _, _, _, _, _, _, _, _, _, _, _],
        [_, _, _, _, _, _, _, _, _, _, _, _, _, _, _, _],
        [_, _, _, _, BK, BK, BK, BK, BK, BK, BK, BK, _, _, _, _],
        [_, _, _, BK, bodyColor, bodyColor, bodyColor, bodyColor, bodyColor, bodyColor, bodyColor, bodyColor, BK, _, _, _],
        [_, _, BK, bodyColor, highlightColor, highlightColor, bodyColor, bodyColor, highlightColor, highlightColor, bodyColor, bodyColor, bodyColor, BK, _, _],
        [_, BK, bodyColor, bodyColor, CW, CW, bodyColor, bodyColor, CW, CW, bodyColor, bodyColor, bodyColor, bodyColor, BK, _],
        [_, BK, bodyColor, bodyColor, CW, CW, bodyColor, bodyColor, CW, CW, bodyColor, bodyColor, bodyColor, bodyColor, BK, _],
        [_, BK, bodyColor, bodyColor, bodyColor, bodyColor, bodyColor, bodyColor, bodyColor, bodyColor, bodyColor, bodyColor, bodyColor, bodyColor, BK, _],
        [_, BK, bodyColor, bodyColor, bodyColor, bodyColor, bodyColor, bodyColor, bodyColor, bodyColor, bodyColor, bodyColor, bodyColor, bodyColor, BK, _],
        [_, _, BK, bodyColor, bodyColor, bodyColor, bodyColor, bodyColor, bodyColor, bodyColor, bodyColor, bodyColor, bodyColor, BK, _, _],
        [_, _, _, BK, BK, BK, BK, BK, BK, BK, BK, BK, BK, _, _, _],
        [_, _, BK, BK, _, _, _, _, _, _, _, _, BK, BK, _, _],
        [_, _, BK, BK, _, _, _, _, _, _, _, _, BK, BK, _, _],
        [_, _, _, _, _, _, _, _, _, _, _, _, _, _, _, _],
        [_, _, _, _, _, _, _, _, _, _, _, _, _, _, _, _],
        [_, _, _, _, _, _, _, _, _, _, _, _, _, _, _, _]

    // LOG SPRITES (different sizes: small 24px, medium 48px, large 72px in original)
    function createLogSprite(widthTiles) {
      const width = widthTiles * 16;
      const sprite = [];

      for (let y = 0; y < 16; y++) {
        const row = [];
        for (let x = 0; x < width; x++) {
          // Top and bottom edges
          if (y < 3 || y > 12) {
            row.push(_);
          }
          // Bark edges
          else if (y === 3 || y === 12) {
            if (x < 2 || x >= width - 2) row.push(_);
            else row.push(LK);
          }
          // Log body
          else {
            if (x < 2 || x >= width - 2) {
              row.push(y === 7 || y === 8 ? LD : _);
            } else if (x === 2 || x === width - 3) {
              row.push(LD);
            } else {
              // Wood grain pattern
              if (y === 7 || y === 8) {
                row.push(LL);
              } else if ((x + y) % 6 === 0) {
                row.push(LD);
              } else {
                row.push(LB);
              }
            }
          }
        }
        sprite.push(row);
      }
      return sprite;
    }

    // Draw the game background (lanes)
    function drawBackground() {
      // Clear canvas
      ctx.fillStyle = COLORS.BLACK;
      ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

      // Header area (score/time)
      ctx.fillStyle = COLORS.DARK_BLUE;
      ctx.fillRect(0, 0, CANVAS_WIDTH, TILE_SIZE);

      // Home row (goal area with lilypads)
      ctx.fillStyle = COLORS.DARK_BLUE;
      ctx.fillRect(0, TILE_SIZE, CANVAS_WIDTH, TILE_SIZE);

      // Draw lilypad homes (5 goal spots)
      for (let i = 0; i < 5; i++) {
        const homeX = (i * 3 + 1) * TILE_SIZE - TILE_SIZE / 4;
        drawLilypad(homeX, TILE_SIZE + 8 * SCALE);
      }

      // River lanes (water)
      ctx.fillStyle = COLORS.WATER_BLUE;
      ctx.fillRect(0, TILE_SIZE * 2, CANVAS_WIDTH, TILE_SIZE * 5);

      // Median (safe zone between river and road)
      drawGrassStripe(TILE_SIZE * 7);

      // Road lanes
      ctx.fillStyle = COLORS.ROAD_GRAY;
      ctx.fillRect(0, TILE_SIZE * 8, CANVAS_WIDTH, TILE_SIZE * 5);

      // Road lane markings (dashed lines)
      ctx.fillStyle = COLORS.UI_WHITE;
      for (let lane = 0; lane < 4; lane++) {
        const y = TILE_SIZE * (8.5 + lane) + TILE_SIZE / 2 - 2 * SCALE;
        for (let dash = 0; dash < 14; dash++) {
          ctx.fillRect(dash * TILE_SIZE + 16 * SCALE, y, 16 * SCALE, 2 * SCALE);
        }
      }

      // Start zone (grass)
      drawGrassStripe(TILE_SIZE * 13);

      // Footer
      ctx.fillStyle = COLORS.DARK_BLUE;
      ctx.fillRect(0, TILE_SIZE * 14, CANVAS_WIDTH, TILE_SIZE);
    }

    // Draw a grass stripe
    function drawGrassStripe(y) {
      ctx.fillStyle = COLORS.GRASS_GREEN;
      ctx.fillRect(0, y, CANVAS_WIDTH, TILE_SIZE);

      // Add grass texture
      ctx.fillStyle = COLORS.GRASS_DARK;
      for (let x = 0; x < CANVAS_WIDTH; x += 8 * SCALE) {
        ctx.fillRect(x, y + 2 * SCALE, 2 * SCALE, 4 * SCALE);
        ctx.fillRect(x + 4 * SCALE, y + TILE_SIZE - 6 * SCALE, 2 * SCALE, 4 * SCALE);
      }
    }

    // Draw a lilypad (goal)
    function drawLilypad(x, y) {
      ctx.fillStyle = COLORS.LILYPAD_GREEN;
      ctx.beginPath();
      ctx.arc(x + 24 * SCALE, y + 12 * SCALE, 20 * SCALE, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = COLORS.LILYPAD_DARK;
      ctx.beginPath();
      ctx.arc(x + 24 * SCALE, y + 12 * SCALE, 14 * SCALE, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = COLORS.DARK_BLUE;
      ctx.beginPath();
      ctx.arc(x + 24 * SCALE, y + 12 * SCALE, 8 * SCALE, 0, Math.PI * 2);
      ctx.fill();
    }
